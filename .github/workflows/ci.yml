name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (contracts + JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:js
      - run: cargo test -p charter -p mock-ft

  wasm:
    name: Build deployable wasm (cargo-near)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-near (official installer)
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      # cargo-near post-processes the wasm (wasm-opt, sign-ext lowering) so newer rustc output runs on the NEAR VM.
      - name: Build charter
        working-directory: contracts/charter
        run: cargo near build non-reproducible-wasm --no-abi
      - name: Build mock-ft
        working-directory: contracts/mock-ft
        run: cargo near build non-reproducible-wasm --no-abi
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: target/near/**/*.wasm
          if-no-files-found: error
