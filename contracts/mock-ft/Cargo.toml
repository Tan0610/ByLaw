[package]
name = "mock-ft"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal NEP-141 tUSD (6 decimals) with open capped mint, for Charter tests and testnet"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
